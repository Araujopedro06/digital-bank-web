# Netlify deploy. Vercel and Cloudflare Pages need the same three settings:
# build "npm run build", publish "dist/digital-bank-web/browser", and an SPA
# rewrite so deep links reach index.html.
#
# Set API_URL in the host's environment variables to the deployed API, including
# the /api suffix. The build writes it into config.json; without it the site
# calls /api on its own origin, which is right for local use and wrong here.

[build]
  command = "npm run build && node scripts/write-config.mjs"
  publish = "dist/digital-bank-web/browser"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/config.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
