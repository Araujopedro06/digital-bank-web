server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript application/json text/css application/wasm;
    gzip_min_length 1024;

    # Deep links are client-side routes; the server only ever has index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted bundles never change under the same name.
    location ~* \.(js|css|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The face weights are large and static, but not fingerprinted.
    location /models/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Read at startup: it must not be a stale copy from a previous deployment.
    location = /config.json {
        add_header Cache-Control "no-store";
    }
}
