<div class="auth">
  <div class="card">
    <h1>Entrar</h1>
    <p class="muted subtitle">Acesse sua conta Digital Bank.</p>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </div>

      <button class="btn full" type="submit" [disabled]="form.invalid || submitting()">
        {{ submitting() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="muted footer">Não tem conta? <a routerLink="/register">Abrir conta</a></p>
  </div>
</div>
