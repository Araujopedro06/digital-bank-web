<div class="auth">
  <div class="card">
    <h1>Abrir conta</h1>
    <p class="muted subtitle">Sua conta corrente é criada na hora.</p>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="name">Nome</label>
        <input id="name" type="text" formControlName="name" autocomplete="name" />
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
        />
        <small class="muted">Mínimo de 8 caracteres.</small>
      </div>

      <button class="btn full" type="submit" [disabled]="form.invalid || submitting()">
        {{ submitting() ? 'Criando…' : 'Abrir conta' }}
      </button>
    </form>

    <p class="muted footer">
      Já tem conta? <a routerLink="/login" [queryParams]="carryOver">Entrar</a>
    </p>
  </div>
</div>
